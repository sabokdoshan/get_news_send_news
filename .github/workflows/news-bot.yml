name: Saba Media - Social Security News Bot

# دو راه اجرا:
# 1) خودکار هر 30 دقیقه توسط خودِ گیت‌هاب (ممکن است چند دقیقه تاخیر داشته باشد)
# 2) صدا زدن دستی از بیرون (مثلاً از Google Apps Script) برای زمان‌بندی دقیق‌تر
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # برای commit کردن فایل seen_links.json (جلوگیری از ارسال خبر تکراری)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run news bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python social_security_news_bot.py

      - name: Save dedupe state back to repo
        run: |
          git config user.name "saba-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_links.json quiz_state.json
          git diff --cached --quiet || git commit -m "update seen links [skip ci]"
          git push
